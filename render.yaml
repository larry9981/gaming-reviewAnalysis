databases:
  - name: steam-guardrail-db
    databaseName: steam_guardrail
    user: steam_guardrail
    plan: starter

services:
  - type: web
    name: steam-guardrail
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm run start:render
    healthCheckPath: /security
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: steam-guardrail-db
          property: connectionString
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MONTHLY_PLAN_ID
        sync: false
      - key: AIRWALLEX_ENV
        value: prod
      - key: AIRWALLEX_CLIENT_ID
        sync: false
      - key: AIRWALLEX_API_KEY
        sync: false
      - key: AIRWALLEX_ACCOUNT_ID
        sync: false
      - key: AIRWALLEX_CURRENCY
        value: USD
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESET_PASSWORD_WEBHOOK_URL
        sync: false
