databases:
  - name: steam-guardrail-db
    databaseName: steam_guardrail
    user: steam_guardrail
    plan: basic-256mb

services:
  - type: web
    name: steam-guardrail
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    preDeployCommand: pnpm run db:migrate:render
    startCommand: pnpm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: steam-guardrail-db
          property: connectionString
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MONTHLY_PLAN_ID
        sync: false
      - key: WORLDFIRST_ENV
        value: prod
      - key: WORLDFIRST_CLIENT_ID
        sync: false
      - key: WORLDFIRST_PRIVATE_KEY
        sync: false
      - key: WORLDFIRST_KEY_VERSION
        value: "1"
      - key: WORLDFIRST_API_BASE_URL
        sync: false
      - key: WORLDFIRST_ACCOUNT_ID
        sync: false
      - key: WORLDFIRST_CURRENCY
        value: USD
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESET_PASSWORD_WEBHOOK_URL
        sync: false
